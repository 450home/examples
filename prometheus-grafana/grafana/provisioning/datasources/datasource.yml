apiVersion: 1

datasources:
  # The URL must match the internal domain given to the Prometheus instance
  # (`--domain prometheus-internal.internal.`). Update it here if you deploy
  # Prometheus under a different name.
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus-internal.internal:9090
    isDefault: true
    editable: true
    jsonData:
      # match the Prometheus scrape_interval so rate() windows behave
      timeInterval: 15s
