name: deploy-ubuntu-web-terminal-fra

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      UKC_METRO: fra
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Unikraft CLI
        run: |
          mkdir -p "$HOME/.local/bin" "$HOME/ukc-build"
          curl -fsSL "https://github.com/unikraft-cloud/cli/releases/download/v0.4.2/unikraft-cli_0.4.2_linux_amd64.tar.gz" -o "$HOME/ukc-build/unikraft-cli.tar.gz"
          tar -xzf "$HOME/ukc-build/unikraft-cli.tar.gz" -C "$HOME/ukc-build"
          find "$HOME/ukc-build" -type f -name unikraft -exec cp {} "$HOME/.local/bin/unikraft" \;
          chmod +x "$HOME/.local/bin/unikraft"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/unikraft" version

      - name: Log in to Unikraft Cloud
        env:
          UKC_TOKEN: ${{ secrets.UKC_TOKEN }}
        run: |
          printf '%s' "$UKC_TOKEN" | unikraft login --token - --organization iudd

      - name: Build and publish image
        working-directory: ubuntu-web-terminal
        run: |
          unikraft build . --output iudd/ubuntu-web-terminal:latest

      - name: Create persistent data volume
        run: |
          unikraft volumes get ubuntu-web-terminal-data --metro fra >/dev/null 2>&1 || \
            unikraft volumes create --metro fra --name ubuntu-web-terminal-data --size 1GiB

      - name: Deploy to Frankfurt
        working-directory: ubuntu-web-terminal
        run: |
          unikraft run --metro fra \
            -n ubuntu-web-terminal \
            -m 1G \
            -v ubuntu-web-terminal-data:/data \
            -p 443:6080/tls+http \
            --image iudd/ubuntu-web-terminal:latest
