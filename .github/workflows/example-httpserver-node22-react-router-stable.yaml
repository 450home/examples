name: examples/httpserver-node22-react-router (stable)

on:
  workflow_dispatch:

  push:
    branches: [ main ]
    paths:
    - '.github/workflows/example-httpserver-node22-react-router-stable.yaml'
    - 'httpserver-node22-react-router/**'
    - '!httpserver-node22-react-router/README.md'

  pull_request:
    types: [ opened, synchronize, reopened ]
    branches: [ main ]
    paths:
    - '.github/workflows/example-httpserver-node22-react-router-stable.yaml'
    - 'httpserver-node22-react-router/**'
    - '!httpserver-node22-react-router/README.md'

  schedule:
  - cron: '30 16 * * 1-5'

permissions:
  contents: read

# Automatically cancel in-progress actions on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request_target' && github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  UKC_METRO: "https://api.${{ vars.UKC_METRO_STABLE }}.unikraft.cloud/v1"
  UKC_TOKEN: ${{ secrets.UKC_TOKEN }}
  KRAFTKIT_NO_CHECK_UPDATES: true
  KRAFTKIT_LOG_LEVEL: debug

jobs:
  integration:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Test
      id: test
      uses: unikraft/kraftkit@staging
      with:
        run: |
          set -xe;

          cd httpserver-node22-react-router;

          kraft cloud deploy \
            --no-start \
            --name httpserver-node22-react-router-stable-${GITHUB_RUN_ID} \
            --runtime index.unikraft.io/official-testing/base-compat:latest \
            --subdomain httpserver-node22-react-router-stable-${GITHUB_RUN_ID} \
            -p 443:3000 \
            -M 768 \
            .;

          # wait for the instance to start
          kraft cloud vm start -w 5s httpserver-node22-react-router-stable-${GITHUB_RUN_ID};
          sleep 5;

          curl -Lv --fail-with-body --max-time 10 https://httpserver-node22-react-router-stable-${GITHUB_RUN_ID}.${{ vars.UKC_METRO_STABLE }}.unikraft.app

    - name: Cleanup
      uses: unikraft/kraftkit@staging
      if: always()
      with:
        run: |
          set -xe;

          kraft cloud vm stop httpserver-node22-react-router-stable-${GITHUB_RUN_ID} || true;
          kraft cloud vm logs httpserver-node22-react-router-stable-${GITHUB_RUN_ID} || true;
          kraft cloud vm rm httpserver-node22-react-router-stable-${GITHUB_RUN_ID} || true;
          kraft cloud img rm index.unikraft.io/test/httpserver-node22-react-router-stable-${GITHUB_RUN_ID} || true;
