name: deploy-novnc-ghcr-was

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # 推送 ghcr.io 必需

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Unikraft CLI
        run: |
          mkdir -p "$HOME/.local/bin" "$HOME/ukc-build"
          curl -fsSL "https://github.com/unikraft-cloud/cli/releases/download/v0.4.2/unikraft-cli_0.4.2_linux_amd64.tar.gz" -o "$HOME/ukc-build/cli.tgz"
          tar -xzf "$HOME/ukc-build/cli.tgz" -C "$HOME/ukc-build"
          find "$HOME/ukc-build" -type f -name unikraft -exec cp {} "$HOME/.local/bin/unikraft" \;
          chmod +x "$HOME/.local/bin/unikraft"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Log in to Unikraft Cloud
        env:
          UKC_TOKEN: ${{ secrets.UKC_TOKEN }}
        run: |
          printf '%s' "$UKC_TOKEN" | unikraft login --token - --organization iudd

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # 关键: 构建输出直接指向 ghcr.io —— 完全绕开组织 1GiB 镜像配额
      - name: Build and push image to GHCR
        working-directory: novnc-browser
        run: |
          unikraft build . --output "ghcr.io/${{ github.repository_owner }}/novnc-browser:latest"

      - name: Remove existing instance (if any)
        run: |
          curl -sk -X DELETE \
            -H "Authorization: Bearer $UKC_TOKEN" \
            "https://api.was.unikraft.cloud/v1/instances?name=novnc-browser-was" || true
        env:
          UKC_TOKEN: ${{ secrets.UKC_TOKEN }}

      - name: Deploy to WAS from GHCR
        run: |
          unikraft run --metro was \
            -n novnc-browser-was \
            -m 4G \
            -p 443:6080/tls+http \
            --image "ghcr.io/${{ github.repository_owner }}/novnc-browser:latest"
