name: deploy-novnc-fra

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install KraftKit CLI
        run: |
          curl -fsSL https://github.com/unikraft/kraftkit/releases/download/v0.12.15/kraft_0.12.15_linux_amd64.tar.gz -o "$HOME/kraft.tar.gz"
          tar -xzf "$HOME/kraft.tar.gz" -C "$HOME"
          chmod +x "$HOME/kraft"
          echo "$HOME" >> "$GITHUB_PATH"
      - name: Configure Unikraft Cloud
        run: |
          echo "UKC_TOKEN=${{ secrets.UKC_TOKEN }}" >> "$GITHUB_ENV"
          echo "UKC_METRO=fra" >> "$GITHUB_ENV"
      - name: Build and package noVNC
        working-directory: novnc-browser
        run: |
          kraft build --arch x86_64
          kraft pkg --as oci --name ${{ secrets.UKC_ORG }}/novnc-browser:latest
      - name: Deploy noVNC to FRA
        working-directory: novnc-browser
        run: |
          kraft cloud deploy --metro fra --name vnc-browser --memory 4G --port 443:6080/tls+http ${{ secrets.UKC_ORG }}/novnc-browser:latest
