name: deploy-omnirush2api-was

on:
  workflow_dispatch:
    inputs:
      omnirush_refresh_token:
        description: 'OMNIRUSH_REFRESH_TOKEN'
        required: true
        type: string
      api_key:
        description: 'API_KEY (optional)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      UKC_TOKEN: ${{ secrets.UKC_TOKEN }}
      OMNIRUSH_REFRESH_TOKEN: ${{ inputs.omnirush_refresh_token }}
      API_KEY: ${{ inputs.api_key }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Unikraft CLI
        run: |
          mkdir -p "$HOME/.local/bin" "$HOME/ukc-build"
          curl -fsSL "https://github.com/unikraft-cloud/cli/releases/download/v0.4.2/unikraft-cli_0.4.2_linux_amd64.tar.gz" -o "$HOME/ukc-build/unikraft-cli.tar.gz"
          tar -xzf "$HOME/ukc-build/unikraft-cli.tar.gz" -C "$HOME/ukc-build"
          find "$HOME/ukc-build" -type f -name unikraft -exec cp {} "$HOME/.local/bin/unikraft" \;
          chmod +x "$HOME/.local/bin/unikraft"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/unikraft" version

      - name: Log in to Unikraft Cloud
        run: |
          printf '%s' "$UKC_TOKEN" | unikraft login --token - --organization susanlee

      - name: Build and publish image
        working-directory: omnirush2api
        run: |
          unikraft build . --output susanlee/omnirush2api:latest

      - name: Remove existing instance (if any)
        run: |
          unikraft instances delete omnirush2api --metro was || true

      - name: Deploy to WAS
        run: |
          if [ -n "$API_KEY" ]; then
            unikraft run --metro was \
              -n omnirush2api \
              -m 1G \
              -p 20129:20129/tls+http \
              -e OMNIRUSH_REFRESH_TOKEN="$OMNIRUSH_REFRESH_TOKEN" \
              -e API_KEY="$API_KEY" \
              --image susanlee/omnirush2api:latest
          else
            unikraft run --metro was \
              -n omnirush2api \
              -m 1G \
              -p 20129:20129/tls+http \
              -e OMNIRUSH_REFRESH_TOKEN="$OMNIRUSH_REFRESH_TOKEN" \
              --image susanlee/omnirush2api:latest
          fi
